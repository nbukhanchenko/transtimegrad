[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# torch.Size() and stateless loss objects are immutable/default-call safe here.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
